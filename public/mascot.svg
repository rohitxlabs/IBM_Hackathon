<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#818cf8"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24"/>
      <stop offset="100%" style="stop-color:#f59e0b"/>
    </linearGradient>
  </defs>
  <!-- Body -->
  <ellipse cx="100" cy="120" rx="45" ry="55" fill="url(#bodyGrad)"/>
  <!-- Head -->
  <circle cx="100" cy="75" r="35" fill="url(#bodyGrad)"/>
  <!-- Eyes -->
  <ellipse cx="88" cy="72" rx="6" ry="7" fill="white"/>
  <ellipse cx="112" cy="72" rx="6" ry="7" fill="white"/>
  <circle cx="90" cy="73" r="3" fill="#1e1b4b"/>
  <circle cx="114" cy="73" r="3" fill="#1e1b4b"/>
  <circle cx="91" cy="71" r="1" fill="white"/>
  <circle cx="115" cy="71" r="1" fill="white"/>
  <!-- Smile -->
  <path d="M 85 85 Q 100 98 115 85" stroke="#1e1b4b" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Hat -->
  <ellipse cx="100" cy="48" rx="22" ry="10" fill="url(#goldGrad)"/>
  <path d="M 82 48 Q 100 25 118 48" fill="url(#goldGrad)"/>
  <circle cx="100" cy="32" r="6" fill="url(#goldGrad)"/>
  <!-- Ears -->
  <path d="M 65 65 Q 55 55 60 75" fill="url(#bodyGrad)"/>
  <path d="M 135 65 Q 145 55 140 75" fill="url(#bodyGrad)"/>
  <!-- Arms -->
  <path d="M 58 110 Q 35 95 30 105" stroke="url(#bodyGrad)" stroke-width="12" fill="none" stroke-linecap="round"/>
  <path d="M 142 110 Q 165 95 170 105" stroke="url(#bodyGrad)" stroke-width="12" fill="none" stroke-linecap="round"/>
  <!-- Hands -->
  <circle cx="28" cy="105" r="8" fill="url(#bodyGrad)"/>
  <circle cx="172" cy="105" r="8" fill="url(#bodyGrad)"/>
  <!-- Tail -->
  <path d="M 100 175 Q 120 190 110 200 Q 95 195 100 175" fill="url(#bodyGrad)"/>
</svg>
